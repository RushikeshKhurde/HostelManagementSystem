# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hostel_management_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# HS256 requires secret of at least 256 bits (32 bytes).
# In production, set the JWT_SECRET environment variable.
# ===============================
app.jwt.secret=${JWT_SECRET:LocalDevSecretKeyMustBeOverriddenInProductionAtLeast32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Initial Data Seeding Credentials
# Configure via environment variables in production.
# ===============================
app.seed.admin.username=${HOSTEL_ADMIN_USERNAME:admin}
app.seed.admin.email=${HOSTEL_ADMIN_EMAIL:admin@hostel.com}
app.seed.admin.password=${HOSTEL_ADMIN_PASSWORD:Admin@123456}

app.seed.warden.username=${HOSTEL_WARDEN_USERNAME:warden}
app.seed.warden.email=${HOSTEL_WARDEN_EMAIL:warden@hostel.com}
app.seed.warden.password=${HOSTEL_WARDEN_PASSWORD:Warden@123456}

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173}

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-photos

# ===============================
# OTP Delivery Modes
# Possible values: 'real' or 'simulation'
# ===============================
app.otp.email.mode=${OTP_EMAIL_MODE:simulation}
app.otp.sms.mode=${OTP_SMS_MODE:simulation}

# ===============================
# Email (SMTP) Configuration
# Set environment variables: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# Supported for Gmail SMTP, Outlook SMTP, or custom mail servers.
# ===============================
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# SMS Provider Configuration
# Supported providers: 'twilio', 'fast2sms'
# ===============================
app.sms.provider=${SMS_PROVIDER:twilio}

# Twilio Configuration
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Fast2SMS Configuration
app.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
app.sms.fast2sms.route=${FAST2SMS_ROUTE:otp}
