# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Database Configuration
# Make sure MySQL is running and the database exists:
#   CREATE DATABASE hostel_management_db;
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_management?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# To test WITHOUT installing MySQL, comment the 4 lines above
# and uncomment the H2 in-memory database lines below instead:
# ===============================
# spring.datasource.url=jdbc:h2:mem:hosteldb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# open-in-view=true keeps the DB session open through JSON serialization so related
# entities (e.g. a Booking's Room and Student) can be lazily loaded when returned in a response.
spring.jpa.open-in-view=true

# ===============================
# JWT Configuration
# IMPORTANT: change app.jwt.secret before deploying to production.
# Must be at least 32 characters long (HS256 requirement).
# ===============================
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandom123456
app.jwt.expiration-ms=86400000

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-photos

# ===============================
# OTP Delivery Modes
# Possible values: 'real' or 'simulation'
# ===============================
app.otp.email.mode=${OTP_EMAIL_MODE:simulation}
app.otp.sms.mode=${OTP_SMS_MODE:simulation}

# ===============================
# Email (SMTP) Configuration
# Set environment variables: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# Supported for Gmail SMTP, Outlook SMTP, or custom mail servers.
# ===============================
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# SMS Provider Configuration
# Supported providers: 'twilio', 'fast2sms'
# ===============================
app.sms.provider=${SMS_PROVIDER:twilio}

# Twilio Configuration
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Fast2SMS Configuration
app.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
app.sms.fast2sms.route=${FAST2SMS_ROUTE:otp}
