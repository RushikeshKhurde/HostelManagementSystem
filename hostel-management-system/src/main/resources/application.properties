# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hostel_management_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# HS256 requires secret of at least 256 bits (32 bytes).
# In production, set the JWT_SECRET environment variable.
# ===============================
app.jwt.secret=${JWT_SECRET:LocalDevSecretKeyMustBeOverriddenInProductionAtLeast32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Initial Data Seeding Credentials
# Configure via environment variables in production.
# ===============================
app.seed.admin.username=${HOSTEL_ADMIN_USERNAME:admin}
app.seed.admin.email=${HOSTEL_ADMIN_EMAIL:admin@hostel.com}
app.seed.admin.password=${HOSTEL_ADMIN_PASSWORD:Admin@123456}

app.seed.warden.username=${HOSTEL_WARDEN_USERNAME:warden}
app.seed.warden.email=${HOSTEL_WARDEN_EMAIL:warden@hostel.com}
app.seed.warden.password=${HOSTEL_WARDEN_PASSWORD:Warden@123456}

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173}

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
