# ===============================
# Server & Optional Local Config
# ===============================
server.port=8080
spring.config.import=optional:classpath:application-local.properties

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hostel_management_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# HS256 requires secret of at least 256 bits (32 bytes).
# In production, set the JWT_SECRET environment variable.
# ===============================
app.jwt.secret=${JWT_SECRET:LocalDevSecretKeyMustBeOverriddenInProductionAtLeast32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Initial Data Seeding Credentials
# Configure via environment variables in production.
# ===============================
app.seed.admin.username=${HOSTEL_ADMIN_USERNAME:admin}
app.seed.admin.email=${HOSTEL_ADMIN_EMAIL:admin@hostel.com}
app.seed.admin.password=${HOSTEL_ADMIN_PASSWORD:Admin@123456}

app.seed.warden.username=${HOSTEL_WARDEN_USERNAME:warden}
app.seed.warden.email=${HOSTEL_WARDEN_EMAIL:warden@hostel.com}
app.seed.warden.password=${HOSTEL_WARDEN_PASSWORD:Warden@123456}

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173}

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-photos

# ===============================
# Email OTP Delivery Mode
# Possible values: 'real' or 'simulation'
# ===============================
app.otp.email.mode=${OTP_EMAIL_MODE:simulation}

# ===============================
# Email / SMTP Configuration
# ===============================
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ===============================
# Password Reset / OTP Configuration
# ===============================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-resends=${OTP_MAX_RESENDS:3}
app.otp.rate-limit.max-requests=${OTP_RATE_LIMIT_MAX_REQUESTS:3}
app.otp.rate-limit.window-minutes=${OTP_RATE_LIMIT_WINDOW_MINUTES:15}