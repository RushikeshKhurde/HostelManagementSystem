spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=TestSecretKeyForTestingPurposesOnlyNeedsToBeLongEnough32Chars
app.jwt.expiration-ms=86400000

app.seed.admin.username=admin
app.seed.admin.email=admin@hostel.com
app.seed.admin.password=Admin123

app.seed.warden.username=warden
app.seed.warden.email=warden@hostel.com
app.seed.warden.password=Warden123

app.cors.allowed-origins=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@hostel.com
spring.mail.password=testpassword
app.mail.from=test@hostel.com
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-resends=3
app.otp.rate-limit.max-requests=3
app.otp.rate-limit.window-minutes=15
